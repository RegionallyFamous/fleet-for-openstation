name: Validate

on:
  push:
  pull_request:

jobs:
  plugin:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - run: ./bin/build.sh
      - uses: actions/upload-artifact@v4
        if: matrix.php == '8.3'
        with:
          name: openstation-fleet
          path: dist/openstation-fleet.zip
