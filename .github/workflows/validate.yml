name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - run: ./bin/build.sh
      - uses: actions/upload-artifact@v7
        if: matrix.php == '8.5'
        with:
          name: fleet-for-openstation
          path: dist/fleet-for-openstation.zip

  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./bin/build.sh
      - run: mkdir -p plugin-check-build && unzip -q dist/fleet-for-openstation.zip -d plugin-check-build
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: plugin-check-build/fleet-for-openstation
